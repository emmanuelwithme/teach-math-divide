<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學一學｜直式除法</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="btn small ghost" href="index.html">← 首頁</a>
    <span class="pill mode" id="modePill">整數 ÷ 整數</span>
    <span class="spacer"></span>
    <a class="btn small" id="playLink" href="play.html">🎮 玩一玩</a>
    <button class="btn small ghost" id="ttsBtn">🗣 朗讀</button>
    <button class="btn small ghost" id="sfxBtn">🔊</button>
  </div>

  <div class="card tinted">
    <div class="problem" id="problem"></div>
    <div class="story" id="story"><span class="emoji">🍎</span><span id="storyText"></span></div>
  </div>

  <div class="card" id="moveCard">
    <h2>🚚 第一步：讓除數變成整數 <span class="small muted">（商不變性質）</span></h2>
    <div id="moveStage"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn small" id="replayMove">▶ 再看一次搬家</button>
    </div>
  </div>

  <div class="cols two">
    <div class="card">
      <h2>🧱 分方塊（看得見的除法）</h2>
      <div id="stage"></div>
    </div>
    <div class="card">
      <h2>📐 直式</h2>
      <div class="ld-scroll"><div id="board"></div></div>
      <div class="phases" id="phases">
        <span class="phase-chip" data-p="take">① 看</span>
        <span class="phase-chip" data-p="quotient">② 商</span>
        <span class="phase-chip" data-p="multiply">③ 乘</span>
        <span class="phase-chip" data-p="subtract">④ 減・比</span>
        <span class="phase-chip" data-p="bringdown">⑤ 落下</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="narrate" id="narrate" aria-live="polite"></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn" id="prevBtn">⬅ 上一步</button>
      <button class="btn primary" id="nextBtn">下一步 ➡</button>
      <button class="btn" id="autoBtn">▶ 自動播放</button>
      <button class="btn ghost" id="restartBtn">↺ 從頭看</button>
      <span class="spacer"></span>
      <button class="btn small" id="placeBtn">🏷 位值標記：關</button>
      <button class="btn small" id="newBtn">🎲 換一題</button>
    </div>
    <div class="small muted center" style="margin-top:8px">
      也可以用鍵盤：<kbd>←</kbd> <kbd>→</kbd> 切換步驟，<kbd>空白鍵</kbd> 自動播放
    </div>
  </div>

  <div class="card">
    <details open>
      <summary>🔍 為什麼這樣算是對的？（把被除數拆成幾大塊）</summary>
      <div id="whyBody" style="margin-top:10px"></div>
    </details>
  </div>

  <div class="card">
    <details>
      <summary>👩‍🏫 老師指定題目（直接輸入要練習的數）</summary>
      <div class="teacher-panel" style="margin-top:10px">
        <label>被除數 <input id="inDividend" inputmode="decimal" placeholder="8.4"></label>
        <label>除數 <input id="inDivisor" inputmode="decimal" placeholder="0.4"></label>
        <button class="btn small primary" id="goBtn">打開這題</button>
        <span class="small muted" id="teacherMsg"></span>
      </div>
    </details>
  </div>
</div>
<script type="module" src="js/learn.js"></script>
</body>
</html>
